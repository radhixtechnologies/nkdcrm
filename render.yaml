databases:
  - name: nkd-crm-db
    databaseName: nkd_crm
    user: postgres
    plan: free

services:
  - type: web
    name: nkd-crm-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run setup:prod
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nkd-crm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: FRONTEND_URL
        value: https://*.vercel.app
      - key: SUPER_ADMIN_EMAIL
        value: admin@nkdcrm.com
      - key: SUPER_ADMIN_PASSWORD
        value: Admin@123

